[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helpy"
version = "0.7.5"
description = "Asistente de voz con transcripción y LLM local"
requires-python = ">=3.8"
authors = [{name = "HelPy"}]
license = {text = "MIT"}
dependencies = [
    "PyQt5>=5.15.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "soundcard>=0.4.6",
    "SpeechRecognition>=3.16.1",
    "openai>=2.38.0",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "python-dotenv>=1.0.0",
    "llama-cpp-python>=0.3.0",
    "huggingface_hub>=0.24.0",
    "PyMuPDF>=1.24.0",
    "requests>=2.28.0",
    "flask>=3.0.0",
    "waitress>=3.0.0",
    "faster-whisper>=1.0.0",
    "webrtcvad-wheels>=2.0.11",
]

[project.scripts]
helpy = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
